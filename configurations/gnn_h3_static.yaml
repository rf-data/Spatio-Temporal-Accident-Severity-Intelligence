# ------------------------------
general_args:
  data_folder: ml_ready
  file_suffix: ["new_v2"]
  summary_file_name: charac_EDA_summary_v1_2026-03-09_11:33
  preparation_time: 2026-03-23_13:03
  snapshots_name: snapshots_base_v2
  data_name: data_base_v2
  edge_idx_name: edge_index
  ml_df: 2026-03-22_12:32_df_merged 

gnn_settings:
  h3_col: h3_res4
  period_col: time_bin
  target_col: n_accidents
  target_lvl_1: has_accident
  target_lvl_2: n_accidents
