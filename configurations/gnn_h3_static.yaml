  min_events: 2
  neighbor_distance: 1
  include_self_loops: True
  criterion: bce_log_loss
  train_size: 0.7
  val_data: True
  in_dim: 1
  hidden_dim: 32
  dropout: 0.2
  n_epoch: 1
  optimizer: adam
  learn_rate: 1e-3
  weight_decay: 1e-4
  
