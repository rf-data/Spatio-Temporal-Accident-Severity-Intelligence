## yaml-file "Places" dataset
# ------------------------------
# GENERAL
# ------------------------------
general_args:
  summary_name: vehicles
  summary_file_name: vehicles_EDA_summary_v1_2026-03-10_11:24
  data_folder: Fahrzeuge_vehicles
  schema_name: clean
  table_name: vehicles
  name_log: EDA + Cleaning (vehicles)
  name_logfile: eda_clean_vehicles
  selected_years: [2006, 2011]

dataset:
  topic: road accidents
  name: vehicles 

  structure:
    table: True
    image: False
    video: False
    time_series: True
    geo_data: True
    cross_file: True

  # properties:
  #   temporal_granularity: day
  #   spatial_granularity: gps_point

  expectations:
    expected_primary_key: Num_Acc
    # expected_row_growth: yearly_append
    # expected_stationarity: False
  
  merge_behavior:
    default: append
    # allowed_keys:
    #   - Num_Acc

llm:
  model: "gpt-4.1-mini"
  temperature: 0.2

agent:
  version: 1
  max_iterations: 2
  reflexive: True

# ------------------------------
# EDA
# ------------------------------
tool_args:
  missing_analysis: 
    threshold: 0.5

  infinite_analysis:
    params:
      strategy: drop

  duplicate_analysis:
    threshold: 0.01
    grouping: []
    params:
      subset: []
      keep: first

  numeric_summary:
    percentiles: [0.01, 0.05, 0.1, 0.25, 
                  0.75, 0.9, 0.95, 0.99]
      
  categorical_summary:
    top_n: 10
    threshold: 50 
      
  zero_inflation_analysis:
    threshold: 0.8

# ----------------------------------
# DATA CLEANING / SQL_UPLOAD
# ----------------------------------
# --> harmonize_schema + clean_from_json
# eda_cleaning_vehicles

columns:
  numeric: [ID_accident, ID_vehicle, intra_acc_ID,
            public_transport_occupancy]
  categorical: [flow_direction, vehicle_type, fixed_obstacle,
                mobile_obstacle, impact_point, maneuver, 
                engine_type]
  to_drop: []
  rename: 
    Num_Acc: ID_accident
    senc: flow_direction  # quo vadis?
    catv: vehicle_type    # grouping? 'vulnerable' + 'heavy'
    occutc: public_transport_occupancy    # quo vadis?; is_public_transport = (catv in [37, 38, ...])
    obs: fixed_obstacle
    obsm: mobile_obstacle
    choc: impact_point
    manv: maneuver
    motor: engine_type
    num_veh: intra_acc_ID
    id_vehicule: ID_vehicle
    
