report_name: "characteristics_SQL_data"

audit:
  default_checks:
    - time_integrity
    - aggregate_consistency

  arguments:
    db_schema: "accidents"
    frequency: "week"
    group_column: "parent_index"
    metric_column: "n_accidents"
    aggregate_column: "parent_value"
    table_prefix: "h3_res5"


  tables:
    table: f"h3_res5_{frequency}"
    time_column: f"{frequency}_start"


  tools:
    time_gaps:
      threshold: 1
      severity: "high"
    
    cross_resolution:
      tolerance: 0.02
      severity: "medium"
    
    z_score: 
      threshold": 3.0
      severity": "high"

risk:
  thresholds:
    ok: 0
    low: 20
    medium: 60
    high: 120
    critical: 200

  multipliers:
    # Optional multipliers (check-specific)
    check:
      time_gaps: 1.0
      cross_resolution: 1.2
      z_score: 0.9
    # Optional multipliers (issue-type-specific)
    issue:
      tool_failure: 1.5
      missing_time_periods: 1.2
      aggregation_mismatch: 1.3  
  # Cap to prevent one giant finding from dominating
  max_points_per_finding: 120

llm:
  model: "gpt-4.1-mini"
  temperature: 0.2

agent:
  max_iterations: 2
  reflexive: True

