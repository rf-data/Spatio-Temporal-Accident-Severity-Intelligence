## yaml-file "Places" dataset
# ------------------------------
# GENERAL
# ------------------------------
llm:
  model: "gpt-4.1-mini"
  temperature: 0.2

agent:
  version: 1
  max_iterations: 2
  reflexive: True

dataset:
  topic: road accidents
  name: persons 

  structure:
    table: True
    image: False
    video: False
    time_series: True
    geo_data: True
    cross_file: True

  # properties:
  #   temporal_granularity: day
  #   spatial_granularity: gps_point

  expectations:
    expected_primary_key: Num_Acc
    # expected_row_growth: yearly_append
    # expected_stationarity: False
  
  merge_behavior:
    default: append
    # allowed_keys:
    #   - Num_Acc

general_args:
  summary_name: persons
  summary_file_name: persons_EDA_summary_v1_2026-03-10_11:43
  data_folder: Benutzer_usagers
  schema_name: clean
  table_name: persons

# ------------------------------
# RAW DATA
# ------------------------------
tool_args:
  missing_analysis: 
    threshold: 0.5

  infinite_analysis:
    params:
      strategy: drop

  duplicate_analysis:
    threshold: 0.01
    grouping: []
    params:
      subset: []
      keep: first

  numeric_summary:
    percentiles: [0.01, 0.05, 0.1, 0.25, 0.75, 0.9, 0.95, 0.99]
      
  categorical_summary:
    top_n: 10
    threshold: 50 
      
  zero_inflation_analysis:
    threshold: 0.8

