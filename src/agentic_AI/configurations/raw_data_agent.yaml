## yaml-file "Characteristics" dataset
dataset:
  topic: road accidents
  name: chracteristics
  related_datasets: True 
  table: True
  image: False
  video: False
  time_series: True
  geo_data: True 

arguments:
  summary_name: charac
  data_folder: Eigenschaften_characteristics
  db_schema: "accidents"
  table_name: "raw_characteristics"

  tools:
    run_file_eda:
      missing_analysis: 
        threshold: 0.5

      infinite_analysis:
        params:
          strategy: drop

      duplicate_analysis:
        threshold: 0.01
        grouping: []
        params:
          subset: []
          keep: first

      numeric_summary:
        percentiles: [0.01, 0.05, 0.1, 0.25, 0.75, 0.9, 0.95, 0.99]
      
      categorical_summary:
        top_n: 10
        threshold: 50 
      
      zero_inflation_analysis:
        threshold: 0.8

  default_file_checks:
    - basic_overview
    - missing_analysis
    - duplicate_analysis
    - numeric_summary
    - categorical_summary
    - infinite_analysis
    - zero_inflation
    - detect_datetime_candidates

  default_cross_file_checks:
    - merge_candidate_detection
    - cross_file_schema_compare

